[project]
name = "fairness-awareness"
version = "0.2.0"
description = "Dashboard plugin for evaluating model fairness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aisc-plugin-interface>=0.2.6",
    "numpy>=2.4.1",
    "pandas>=2.3.3",
    "onnxruntime>=1.21.0,<2",
    "scikit-learn>=1.3.0",
]

[build-system]
requires = ["uv_build>=0.9.30,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.15.11",
]
